{% load i18n %}

<div id="pritech-install-prompt"
     class="fixed bottom-20 left-4 right-4 z-30 hidden
            sm:left-auto sm:right-4 sm:w-96">
  <div class="rounded-2xl border border-slate-200 bg-white/95 p-4 shadow-2xl
              backdrop-blur-xl
              dark:border-white/10 dark:bg-slate-800/95">
    <div class="flex items-start gap-3">
      <div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl
                  bg-gradient-to-br from-primary-500 to-fuchsia-500
                  text-white shadow-lg shadow-primary-500/30">
        <span class="text-base font-bold">P</span>
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">
          {% trans "Install Pritech PMS" %}
        </h3>
        <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">
          {% trans "Add to your home screen for faster access and offline use." %}
        </p>
      </div>
      <button type="button"
              onclick="dismissInstallPrompt()"
              aria-label="{% trans 'Close' %}"
              class="grid h-6 w-6 shrink-0 place-items-center rounded-md
                     text-slate-400 hover:bg-slate-100 hover:text-slate-600
                     dark:hover:bg-white/10 dark:hover:text-white">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="mt-3 flex items-center gap-2">
      <button type="button"
              onclick="triggerInstall()"
              class="btn btn-primary flex-1 py-2 text-xs">
        {% trans "Install" %}
      </button>
      <button type="button"
              onclick="dismissInstallPrompt()"
              class="btn btn-ghost px-4 py-2 text-xs">
        {% trans "Not now" %}
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  var STORAGE_KEY = 'pritech_pwa_install_dismissed';
  var banner = document.getElementById('pritech-install-prompt');
  if (!banner) return;

  try {
    var dismissedAt = localStorage.getItem(STORAGE_KEY);
    if (dismissedAt) {
      var age = Date.now() - parseInt(dismissedAt, 10);
      if (age < 14 * 24 * 60 * 60 * 1000) return;
    }
  } catch (e) {}

  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (window.navigator.standalone === true) return;

  var deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.remove('hidden');
  });

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    setTimeout(function() {
      banner.classList.remove('hidden');
    }, 8000);
  }

  window.triggerInstall = function() {
    if (!deferredPrompt) {
      alert('{% trans "To install: tap Share → Add to Home Screen" %}');
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        banner.classList.add('hidden');
      }
      deferredPrompt = null;
    });
  };

  window.dismissInstallPrompt = function() {
    banner.classList.add('hidden');
    try {
      localStorage.setItem(STORAGE_KEY, Date.now().toString());
    } catch (e) {}
  };

  window.addEventListener('appinstalled', function() {
    banner.classList.add('hidden');
    deferredPrompt = null;
  });
})();
</script>
